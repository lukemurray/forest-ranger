[package]
name = "forest-ranger-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
base64 = "0.23.1"
gpui-kit = { version = "0.9.0", features = ["tree-sitter-languages"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
uuid = { version = "1.29.0", features = ["v4"] }

# GPUI is painfully slow unoptimized; optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 2

# Already in the tree via GPUI — used to set the Dock icon.
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
